{#- Back to top button for the long pages. Include it last in the page's content block so it is the final
    child of <main>: it sticks to the viewport bottom while the content is on screen and comes to rest
    above the footer (see .back-to-top in styles.css); script.js reveals it after a screenful. -#}
<div class="back-to-top">
    <button class="back-to-top__button" type="button" data-back-to-top hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-up"></use></svg>
        <span class="visually-hidden">Back to top</span>
    </button>
</div>
